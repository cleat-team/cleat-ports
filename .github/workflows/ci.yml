# Pull-request CI: every port, against CLEAT_PINNED_REF from cleat-version.env.
#
# That value is currently `develop`, so this workflow and nightly test the same
# moving target and a failure here does not by itself say whether the port or
# cleat changed. Each run prints the cleat commit under test; read a failure
# against that and against whether the PR touched the port. cleat-version.env
# records why develop was chosen and how to move back to a pin.
name: CI

on:
  pull_request:
    # `edited` is here for the base-branch case, and it is the second time this
    # filter has silently matched nothing.
    #
    # The default types are [opened, synchronize, reopened]. Changing a PR's
    # BASE fires `edited`, which is in none of them -- so a PR opened against a
    # feature branch (where the branches filter below excludes it) and later
    # retargeted to main never runs this workflow at all. Not on open, because
    # the base did not match; not on retarget, because that is not a trigger.
    #
    # Measured on #32: mergeStateStatus CLEAN, one check, "Validate branch
    # name". branch-naming.yml had run at open time because it has no branches
    # filter. So the PR reported the best status GitHub has while its entire
    # test suite had never been queued.
    #
    # `edited` also fires on title and body edits, which re-runs the suite for
    # nothing. That is the right trade: the concurrency group below cancels a
    # superseded run, and a wasted run is cheaper than a silent one.
    types: [opened, synchronize, reopened, edited]
    # develop as well as main. develop became the default branch when this repo
    # adopted the same gitflow as cleat and cleat-bench, and this filter still
    # said [main] -- so the first PR opened against develop merged with the port
    # suite never having run. A branch filter that silently matches nothing is
    # indistinguishable from a passing run.
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover ports
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.list.outputs.ports }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        # Ports are discovered rather than listed here, so adding a port never
        # requires also remembering to edit this workflow. TEMPLATE is not a port.
        run: |
          ports=$(ls ports | grep -vE '^(TEMPLATE|README\.md)$' | jq -R . | jq -sc .)
          echo "ports=$ports" >> "$GITHUB_OUTPUT"
          echo "discovered: $ports"

  port:
    name: ${{ matrix.port }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.discover.outputs.ports) }}
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleat_ports
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.25" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install pinned cleat
        run: make install-cleat
      - name: Run port
        # Set explicitly rather than relying on run-port.sh's default, which is
        # 5442 so that a local run does not collide with cleat's own dev
        # compose. The service container above binds 5432, so CI is the one
        # place the default is wrong.
        env:
          CLEAT_PORTS_PG_PORT: "5432"
        run: make port PORT=${{ matrix.port }}
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.port }}
          path: .port-results/
          if-no-files-found: ignore

  # A single, stable check for branch protection to require.
  #
  # The per-port jobs are matrix-generated from the contents of ports/, so their
  # names change whenever a port is added or renamed. Requiring them by name
  # would either go stale or, worse, leave them un-required -- and a port suite
  # that is not required is a port suite that can go red without blocking a
  # merge, which is the failure this repo exists to avoid.
  #
  # `needs` + an explicit result check, not `if: success()`: a skipped or
  # cancelled dependency does not make this job fail on its own, so the result
  # is inspected rather than inferred.
  ports-gate:
    name: All ports
    needs: [discover, port]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every port job succeeded
        run: |
          echo "discover: ${{ needs.discover.result }}"
          echo "port:     ${{ needs.port.result }}"
          if [ "${{ needs.discover.result }}" != "success" ] || \
             [ "${{ needs.port.result }}" != "success" ]; then
            echo "::error::one or more port jobs did not succeed"
            exit 1
          fi
          echo "all ports passed"
