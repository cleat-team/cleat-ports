# Pull-request CI: every port, against CLEAT_PINNED_REF from cleat-version.env.
#
# That value is currently `develop`, so this workflow and nightly test the same
# moving target and a failure here does not by itself say whether the port or
# cleat changed. Each run prints the cleat commit under test; read a failure
# against that and against whether the PR touched the port. cleat-version.env
# records why develop was chosen and how to move back to a pin.
name: CI

on:
  pull_request:
    # `edited` is here for the base-branch case, and it is the second time this
    # filter has silently matched nothing.
    #
    # The default types are [opened, synchronize, reopened]. Changing a PR's
    # BASE fires `edited`, which is in none of them -- so a PR opened against a
    # feature branch (where the branches filter below excludes it) and later
    # retargeted to main never runs this workflow at all. Not on open, because
    # the base did not match; not on retarget, because that is not a trigger.
    #
    # Measured on #32: mergeStateStatus CLEAN, one check, "Validate branch
    # name". branch-naming.yml had run at open time because it has no branches
    # filter. So the PR reported the best status GitHub has while its entire
    # test suite had never been queued.
    #
    # `edited` also fires on title and body edits, which re-runs the suite for
    # nothing. That is the right trade: the concurrency group below cancels a
    # superseded run, and a wasted run is cheaper than a silent one.
    types: [opened, synchronize, reopened, edited]
    # develop as well as main. develop became the default branch when this repo
    # adopted the same gitflow as cleat and cleat-bench, and this filter still
    # said [main] -- so the first PR opened against develop merged with the port
    # suite never having run. A branch filter that silently matches nothing is
    # indistinguishable from a passing run.
    branches: [main, develop]
  push:
    branches: [main, develop]
  # The merge queue runs the required checks against the PROJECTED tip -- this
  # branch plus everything ahead of it in the batch -- on a temporary
  # `gh-readonly-queue/...` ref. Without this trigger the checks never start in
  # queue context, the queue waits for a status that cannot arrive, and NOTHING
  # MERGES. It is the failure mode to know about before enabling the queue,
  # because it looks like the queue is merely slow.
  #
  # Safe to add here with no other change: nothing in this workflow reads
  # `github.event.pull_request`. It checks out and runs, which is exactly what
  # the queue needs. branch-naming.yml is not in that position and carries a
  # guard for it.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover ports
    runs-on: ubuntu-latest
    # issues:read is for the report-path self-test below, whose one case that
    # needs a real token checks that a NON-auth failure is not blamed on the
    # credential. Read-only, this repo only.
    permissions:
      contents: read
      issues: read
    outputs:
      ports: ${{ steps.list.outputs.ports }}
      needs_ports: ${{ steps.paths.outputs.needs_ports }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the diff below needs the merge base, and the default
          # shallow clone does not have it. A missing base is indistinguishable
          # from an empty diff, which would skip the ports on every PR.
          fetch-depth: 0
      - id: paths
        name: Does this change need the port matrix
        # DEFAULT TO RUNNING. Every branch that cannot positively establish
        # "nothing here affects a port run" emits true, because the two errors
        # are not symmetric: a docs change that runs the matrix wastes 18
        # minutes and is obvious, while a port change that skips it reports
        # green having tested nothing and is invisible.
        #
        # So: unknown event type, missing base, failed diff, empty file list --
        # all true.
        run: |
          set -uo pipefail
          decide() { echo "needs_ports=$1" >> "$GITHUB_OUTPUT"; echo "decision: $1 ($2)"; }

          case "${{ github.event_name }}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}"; HEAD="${{ github.event.pull_request.head.sha }}" ;;
            merge_group)  BASE="${{ github.event.merge_group.base_sha }}";  HEAD="${{ github.event.merge_group.head_sha }}" ;;
            *)            decide true "event ${{ github.event_name }} carries no diff to inspect"; exit 0 ;;
          esac

          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            decide true "no base or head sha on this event"; exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            decide true "base $BASE is not in this clone"; exit 0
          fi

          FILES="$(git diff --name-only "$BASE" "$HEAD")" || { decide true "git diff failed"; exit 0; }
          if [ -z "$FILES" ]; then decide true "empty diff"; exit 0; fi

          echo "changed files:"; echo "$FILES" | sed 's/^/  /'

          # What a port RUN depends on. Anything not matched here cannot change
          # what the matrix does, and the list is deliberately generous --
          # go.mod and the workflow itself are in it because a change to either
          # can alter the run without touching a test.
          if echo "$FILES" | grep -qE '^(scripts/|Makefile$|go\.(mod|sum)$|\.github/workflows/ci\.yml$|ports/[^/]+/(tests/|workflows/|Makefile$|requirements.*$|go\.(mod|sum)$))'; then
            decide true "a path the port run depends on changed"; exit 0
          fi
          decide false "only documentation, inventories and per-port scripts changed"
      - id: list
        # Ports are discovered rather than listed here, so adding a port never
        # requires also remembering to edit this workflow. TEMPLATE is not a port.
        run: |
          ports=$(ls ports | grep -vE '^(TEMPLATE|README\.md)$' | jq -R . | jq -sc .)
          echo "ports=$ports" >> "$GITHUB_OUTPUT"
          echo "discovered: $ports"
      # Here rather than in its own job: it needs no database and no services,
      # so it costs a few seconds on a runner that is already up, and it adds
      # no new required-check context to the branch policy.
      - name: The nightly's reporting path still classifies its failures
        # Here rather than in its own job, for the reason the step below gives:
        # no database, no services, seconds on a runner that is already up, and
        # no new required-check context.
        #
        # `ci.yml` does not run `nightly.yml`, so nothing else in PR CI touches
        # the report path -- a green PR is not evidence that it works. These
        # cases are all known-positives (a bad token, a missing token, zero leg
        # markers), because every branch there fires only when something is
        # already wrong and would otherwise be verified by never running.
        env:
          # A valid token is REQUIRED. The case that needs it is the only one
          # that asks the classifier to disagree -- a non-auth failure must not
          # be blamed on the credential -- and without a token it silently
          # becomes the missing-token case and reports a pass.
          SELFTEST_VALID_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/selftest-report-path.sh
      - name: The fixture service still holds, and still releases
        # Every port depends on scripts/fixture-service.py and nothing tested
        # it. A fixture that stops doing its job does not fail -- it makes the
        # tests relying on it pass for the wrong reason, which is the one
        # failure mode a green suite cannot report. No database, no services,
        # seconds on a runner that is already up.
        run: python3 scripts/selftest-fixture-service.py

      - name: Inventory tables match the tree
        # The dbos-transact-py README's two tables are generated. They were
        # hand-maintained until 2026-09-08 and drifted -- eight cases across
        # four files, four modules missing from the second table entirely, and
        # a Ported column whose cells, stated total and the tree gave three
        # different answers. Correcting cells by hand only restarts that
        # clock; this is what stops it.
        run: python3 ports/dbos-transact-py/scripts/count-queue-cases.py --check
      - name: ISSUES entry numbers are unique and contiguous
        # Entry numbers are assigned by hand from a `tail -1` of the file, and
        # four sessions hold unpushed branches that each took "the next number"
        # from the same base. Neither sees the other until merge, and git
        # reports no conflict -- the entries are appended at different offsets
        # with different text. It happened twice on 2026-09-09, once as a
        # straight collision on 29 and once as advice to avoid it that
        # miscounted the file's two TEMPLATE headings and named a number one
        # too high.
        #
        # The cost is the cross-references: tests say "ISSUES.md 26", so a
        # collision silently redirects every reference to whichever entry
        # sorted first. --self-test runs first because on a clean tree "no
        # duplicates" and "the check is broken" are the same output.
        run: |
          scripts/check-issue-numbers.sh --self-test
          scripts/check-issue-numbers.sh

      - name: A rewritten ISSUES entry names the files that cite it
        # Against the PR's merge base, so it asks "what did THIS change rewrite"
        # rather than "what has ever been rewritten". continue-on-error because
        # it over-reports by design: a mention is not always a citation, and the
        # judgement belongs to a reader rather than to a gate.
        continue-on-error: true
        run: |
          scripts/check-issue-citations.sh --self-test
          scripts/check-issue-citations.sh "origin/${{ github.base_ref || 'develop' }}"

  port:
    name: ${{ matrix.port }}
    needs: discover
    if: needs.discover.outputs.needs_ports == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.discover.outputs.ports) }}
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleat_ports
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.25" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install pinned cleat
        run: make install-cleat
      # Surface WHICH cleat this run built, in the job summary rather than
      # buried in the log.
      #
      # CLEAT_PINNED_REF is `develop` (see cleat-version.env), so the toolchain
      # moves between runs and a red result has two possible causes: the port
      # changed, or cleat did. install-cleat.sh already records the resolved SHA
      # in bin/.cleat-build, and run-port.sh echoes it -- but only into the log
      # body, where nobody thinks to look. nightly.yml promotes it to a step
      # output; this job did not, so on a PR run it was effectively invisible.
      #
      # That cost three sessions an investigation on 2026-09-09: ports develop
      # went red, and the leading hypothesis was the adjacent port commit. The
      # actual cause was cleat#1046 landing upstream one commit before the SHA
      # this run built. With the SHA in the summary, that is a two-run diff
      # instead of a reconstruction from merge timestamps.
      - name: Record which cleat this run built
        if: always()
        run: |
          if [ -f bin/.cleat-build ]; then
            {
              echo "### cleat build"
              echo
              echo '```'
              cat bin/.cleat-build
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "bin/.cleat-build absent: install-cleat did not complete" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run port
        # Set explicitly rather than relying on run-port.sh's default, which is
        # 5442 so that a local run does not collide with cleat's own dev
        # compose. The service container above binds 5432, so CI is the one
        # place the default is wrong.
        env:
          CLEAT_PORTS_PG_PORT: "5432"
        run: make port PORT=${{ matrix.port }}
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.port }}
          path: .port-results/
          if-no-files-found: ignore

  # A single, stable check for branch protection to require.
  #
  # The per-port jobs are matrix-generated from the contents of ports/, so their
  # names change whenever a port is added or renamed. Requiring them by name
  # would either go stale or, worse, leave them un-required -- and a port suite
  # that is not required is a port suite that can go red without blocking a
  # merge, which is the failure this repo exists to avoid.
  #
  # `needs` + an explicit result check, not `if: success()`: a skipped or
  # cancelled dependency does not make this job fail on its own, so the result
  # is inspected rather than inferred.
  ports-gate:
    name: All ports
    needs: [discover, port]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every port job succeeded
        # THIS JOB MUST ALWAYS REPORT. It is a required status check, so a
        # gate that fails to run is indistinguishable to the merge queue from
        # one that has not finished, and nothing merges. `if: always()` above
        # is what guarantees it; do not add a condition here.
        #
        # The skip case is the reason this is not a two-line check. When the
        # matrix is skipped, `needs.port.result` is "skipped" -- and so it is
        # when a dependency FAILED and the matrix never ran. Those two are the
        # same string and must not be the same verdict, so the deliberate skip
        # is recognised by discover's own output rather than by the result.
        run: |
          set -uo pipefail
          echo "discover:   ${{ needs.discover.result }}"
          echo "port:       ${{ needs.port.result }}"
          echo "needs_ports: ${{ needs.discover.outputs.needs_ports }}"

          if [ "${{ needs.discover.result }}" != "success" ]; then
            echo "::error::discover did not succeed, so nothing here knows what should have run"
            exit 1
          fi

          if [ "${{ needs.discover.outputs.needs_ports }}" = "false" ]; then
            # Deliberate skip. Require the matrix to be exactly "skipped": a
            # failure or cancellation here would mean it ran after all and did
            # not pass, which must never be read as "we chose not to run it".
            if [ "${{ needs.port.result }}" != "skipped" ]; then
              echo "::error::the port matrix was not required but reported '${{ needs.port.result }}' rather than 'skipped'"
              exit 1
            fi
            echo "no port ran: this change touches no path a port run depends on."
            echo "See the 'Does this change need the port matrix' step for the file list and the decision."
            exit 0
          fi

          if [ "${{ needs.port.result }}" != "success" ]; then
            echo "::error::one or more port jobs did not succeed"
            exit 1
          fi
          echo "all ports passed"
