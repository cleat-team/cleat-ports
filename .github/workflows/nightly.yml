# Nightly: every port against cleat's DEVELOPMENT branch, reporting to core.
#
# This workflow is the reason this repo does not rot. A satellite repo that only
# runs on its own pull requests goes quiet the moment nobody is actively working
# in it, and then contributes nothing while still looking maintained --
# cleat-bench and cleat-apps both went three months without a push while core
# was pushed daily. A nightly run against core's moving branch, which files its
# failures INTO core, inverts that: the suite stays visible in the place people
# actually look.
#
# workflow_dispatch is here so a core pull request can trigger this suite before
# merging, via ecosystem-ci.yml in cleat-team/cleat.
name: Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      cleat_ref:
        description: "cleat ref to test against (branch, tag, or SHA)"
        required: false
        default: "develop"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.list.outputs.ports }}
      dialects: ${{ steps.list.outputs.dialects }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        # Both dimensions come from here so the matrix and the `complete` gate
        # below cannot drift. If they were listed separately, the gate would
        # verify the matrix against a copy of its own definition.
        run: |
          echo "ports=$(ls ports | grep -vE '^(TEMPLATE|README\.md)$' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo 'dialects=["postgres","mysql","mssql"]' >> "$GITHUB_OUTPUT"

  port:
    name: ${{ matrix.port }} on ${{ matrix.dialect }} vs cleat@${{ inputs.cleat_ref || 'develop' }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.discover.outputs.ports) }}
        dialect: ${{ fromJSON(needs.discover.outputs.dialects) }}
    # No `services:` block. The databases come up through `make deps`, which is
    # the path the harness is built around and the one a developer runs. SQL
    # Server in particular needs a step no service container performs: its image
    # creates no user database, so `deps` runs
    # `sqlcmd -Q "IF DB_ID('cleat_ports') IS NULL CREATE DATABASE cleat_ports"`.
    # Hand-rolling the containers reproduces a failure that is not real.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.25" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      # ONE LEG PER RUNNER, AND THAT IS LOAD-BEARING. Each matrix combination
      # is its own job on a fresh VM, so no leg inherits another's containers,
      # .port-results/ or stray worker process.
      #
      # It matters because `make port`'s cleanup is dialect-blind: in
      #
      #   @trap './scripts/worker.sh stop' EXIT ...; CLEAT_PORTS_DIALECT=$(DIALECT) ./scripts/run-port.sh
      #
      # the assignment is a command prefix on run-port.sh, so the trap's shell
      # never sees it and cleanup runs at the DEFAULT dialect. That is not
      # cosmetic: scripts/worker.sh's stop_worker calls `owned || refuse_foreign`
      # (:224), and owned() matches the running process's command line against
      # $CLEAT_PORTS_DSN (:188) -- which, computed at the wrong dialect, will not
      # match a mysql or mssql worker. Cleanup then declares its own worker
      # foreign and exits, leaving it alive.
      #
      # So a sequential sweep that switched dialects inside ONE shell would
      # leave a worker behind at every non-postgres leg, and the next leg at a
      # different dialect would be refused -- with a message naming two wrong
      # causes before the real one. Nobody has hit it because a single manual
      # run never switches dialects.
      #
      # Do not consolidate these legs into a single job to save runner minutes
      # without re-reading that trap first. Fresh-VM-per-combination is what
      # makes the bug dormant here, not anything this workflow does.
      - name: Start ${{ matrix.dialect }}
        run: make deps DIALECT=${{ matrix.dialect }}
      - name: Install cleat @ ${{ inputs.cleat_ref || 'develop' }}
        run: make install-cleat CLEAT_REF=${{ inputs.cleat_ref || 'develop' }}
      - name: Record cleat commit under test
        id: build
        # Per leg, not once for the run: ports CI builds cleat from a moving
        # CLEAT_PINNED_REF, so a nightly can go red because CLEAT changed with no
        # ports commit involved. Without the SHA in each leg's log that costs an
        # investigation (cleat-ports#87) for information the run already had.
        run: |
          cat bin/.cleat-build >> "$GITHUB_OUTPUT"
          echo "--- ${{ matrix.port }} on ${{ matrix.dialect }}: $(tr '\n' ' ' < bin/.cleat-build)"
      - name: Run port
        run: make port PORT=${{ matrix.port }} DIALECT=${{ matrix.dialect }}
      - name: Prove this leg used ${{ matrix.dialect }}
        # The matrix key is a string we wrote; asserting on it proves only that
        # someone can type. This asks the database two independent questions --
        # what it says it is, and whether the run's rows are in it and NOT in
        # postgres, which is up for every dialect and is where a silent fallback
        # would land.
        run: scripts/assert-dialect.sh ${{ matrix.dialect }}
      - name: Record that this leg reported
        if: always()
        run: |
          mkdir -p .leg
          echo "${{ matrix.port }} ${{ matrix.dialect }} $(tr '\n' ' ' < bin/.cleat-build 2>/dev/null)" \
            > ".leg/${{ matrix.port }}--${{ matrix.dialect }}"
      - name: Upload leg marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leg-${{ matrix.port }}--${{ matrix.dialect }}
          path: .leg/
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.port }}--${{ matrix.dialect }}
          path: .port-results/
          if-no-files-found: ignore

  complete:
    name: Every port ran on every dialect
    needs: [discover, port, complete]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { pattern: "leg-*", path: legs, merge-multiple: true }
      - name: Every expected leg reported
        # `needs:` is NOT the gate. A job that depends on a matrix succeeds when
        # the matrix is EMPTY, so an aggregate gating only on `needs: port`
        # passes when zero legs were generated -- a green run that tested
        # nothing, which is the cleat#1068 shape.
        #
        # So this recomputes ports x dialects from the same `discover` outputs
        # the matrix used and requires every element BY NAME. Comparing sets,
        # not counts: a count is satisfied by the wrong legs reporting.
        env:
          PORTS: ${{ needs.discover.outputs.ports }}
          DIALECTS: ${{ needs.discover.outputs.dialects }}
        run: scripts/assert-legs-complete.sh legs

  report:
    name: Report to core
    needs: [discover, port]
    if: always() && needs.port.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the tracking issue on cleat-team/cleat
        env:
          # A PAT (or GitHub App token) with `issues: write` on cleat-team/cleat.
          # The default GITHUB_TOKEN is scoped to THIS repo and cannot open an
          # issue on another one. If the secret is absent the step says so and
          # exits clean rather than failing the run for a configuration reason
          # that has nothing to do with cleat's behaviour.
          GH_TOKEN: ${{ secrets.CLEAT_CORE_ISSUE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CLEAT_CORE_ISSUE_TOKEN is not set — cannot file the tracking issue."
            echo "Nightly ports failed. See $RUN_URL"
            exit 0
          fi

          TITLE="cleat-ports nightly failing against develop"
          BODY=$(printf '%s\n' \
            "The [cleat-ports](https://github.com/cleat-team/cleat-ports) nightly suite failed against \`develop\`." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "These are ports of other durable-execution frameworks' test suites. A failure here means cleat's behaviour diverged from what an equivalent engine's tests expect — it is not automatically a bug, but it is always worth a look." \
            "" \
            "Triage per [promotion-checklist.md](https://github.com/cleat-team/cleat-ports/blob/main/docs/promotion-checklist.md): confirm it, classify it as bug / missing API / deliberate difference, and if it is one of the first two, land a hermetic regression test in \`tests/conformance/\`." \
            "" \
            "_Filed automatically by cleat-ports nightly. This issue is reused rather than duplicated; check the latest comment for the most recent run._")

          # One tracking issue, reused. A fresh issue per nightly would bury the
          # core repo in duplicates within a week of any sustained failure.
          EXISTING=$(gh issue list --repo cleat-team/cleat --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo cleat-team/cleat --body "Still failing: $RUN_URL"
            echo "commented on #$EXISTING"
          else
            gh issue create --repo cleat-team/cleat --title "$TITLE" --body "$BODY"
          fi
