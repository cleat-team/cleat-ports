# Nightly: every port against cleat's DEVELOPMENT branch, reporting to core.
#
# This workflow is the reason this repo does not rot. A satellite repo that only
# runs on its own pull requests goes quiet the moment nobody is actively working
# in it, and then contributes nothing while still looking maintained --
# cleat-bench and cleat-apps both went three months without a push while core
# was pushed daily. A nightly run against core's moving branch, which files its
# failures INTO core, inverts that: the suite stays visible in the place people
# actually look.
#
# workflow_dispatch is here so a core pull request can trigger this suite before
# merging, via ecosystem-ci.yml in cleat-team/cleat.
name: Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      cleat_ref:
        description: "cleat ref to test against (branch, tag, or SHA)"
        required: false
        default: "develop"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.list.outputs.ports }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "ports=$(ls ports | grep -vE '^(TEMPLATE|README\.md)$' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  port:
    name: ${{ matrix.port }} vs cleat@${{ inputs.cleat_ref || 'develop' }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.discover.outputs.ports) }}
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleat_ports
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.25" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install cleat @ ${{ inputs.cleat_ref || 'develop' }}
        run: make install-cleat CLEAT_REF=${{ inputs.cleat_ref || 'develop' }}
      - name: Record cleat commit under test
        id: build
        run: cat bin/.cleat-build >> "$GITHUB_OUTPUT"
      - name: Run port
        run: make port PORT=${{ matrix.port }}
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.port }}
          path: .port-results/
          if-no-files-found: ignore

  report:
    name: Report to core
    needs: [discover, port]
    if: always() && needs.port.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the tracking issue on cleat-team/cleat
        env:
          # A PAT (or GitHub App token) with `issues: write` on cleat-team/cleat.
          # The default GITHUB_TOKEN is scoped to THIS repo and cannot open an
          # issue on another one. If the secret is absent the step says so and
          # exits clean rather than failing the run for a configuration reason
          # that has nothing to do with cleat's behaviour.
          GH_TOKEN: ${{ secrets.CLEAT_CORE_ISSUE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CLEAT_CORE_ISSUE_TOKEN is not set — cannot file the tracking issue."
            echo "Nightly ports failed. See $RUN_URL"
            exit 0
          fi

          TITLE="cleat-ports nightly failing against develop"
          BODY=$(printf '%s\n' \
            "The [cleat-ports](https://github.com/cleat-team/cleat-ports) nightly suite failed against \`develop\`." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "These are ports of other durable-execution frameworks' test suites. A failure here means cleat's behaviour diverged from what an equivalent engine's tests expect — it is not automatically a bug, but it is always worth a look." \
            "" \
            "Triage per [promotion-checklist.md](https://github.com/cleat-team/cleat-ports/blob/main/docs/promotion-checklist.md): confirm it, classify it as bug / missing API / deliberate difference, and if it is one of the first two, land a hermetic regression test in \`tests/conformance/\`." \
            "" \
            "_Filed automatically by cleat-ports nightly. This issue is reused rather than duplicated; check the latest comment for the most recent run._")

          # One tracking issue, reused. A fresh issue per nightly would bury the
          # core repo in duplicates within a week of any sustained failure.
          EXISTING=$(gh issue list --repo cleat-team/cleat --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo cleat-team/cleat --body "Still failing: $RUN_URL"
            echo "commented on #$EXISTING"
          else
            gh issue create --repo cleat-team/cleat --title "$TITLE" --body "$BODY"
          fi
