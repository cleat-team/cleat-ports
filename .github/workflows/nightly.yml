# Nightly: every port against cleat's DEVELOPMENT branch, reporting to core.
#
# This workflow is the reason this repo does not rot. A satellite repo that only
# runs on its own pull requests goes quiet the moment nobody is actively working
# in it, and then contributes nothing while still looking maintained --
# cleat-bench and cleat-apps both went three months without a push while core
# was pushed daily. A nightly run against core's moving branch, which files its
# failures INTO core, inverts that: the suite stays visible in the place people
# actually look.
#
# workflow_dispatch is here so a core pull request can trigger this suite before
# merging, via ecosystem-ci.yml in cleat-team/cleat.
name: Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      cleat_ref:
        description: "cleat ref to test against (branch, tag, or SHA)"
        required: false
        default: "develop"
      credential_only:
        description: "Only check the report credential (~15s), skip the ports"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # RUNS ON EVERY NIGHTLY, GREEN OR RED, AND THAT IS THE WHOLE POINT.
  #
  # `report` below runs only when the matrix failed, so the credential it needs
  # is exercised only on the nights it is needed. A green night never touches
  # it. Its failure is therefore perfectly correlated with the event it exists
  # to report -- nothing can discover it early, because the only thing that
  # would is the thing it breaks. On 2026-09-09 it was rejected with 401, a real
  # mysql failure was found, and nobody was told (cleat-ports#105).
  #
  # Demonstrated again the next morning at a cost of 25 minutes: a nightly was
  # dispatched specifically to find out whether the rotated secret worked, all
  # six legs passed, `report` was skipped, and the run answered nothing. A
  # healthy run cannot test the failure path. Hence `credential_only`, which
  # runs this job alone.
  #
  # It files nothing and changes nothing.
  credential:
    name: The report credential still works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ secrets.CLEAT_CORE_ISSUE_TOKEN }}
        run: scripts/check-core-credential.sh

  discover:
    # Skipped for a credential-only dispatch; `port` follows through `needs`,
    # and `complete` and `report` carry the same condition because `always()`
    # would otherwise run them against a matrix that never generated.
    # NOT `!inputs.credential_only` alone. On a `schedule` event there is no
    # `inputs` context, and this condition decides whether the ports run at all
    # -- get it wrong and every nightly skips its entire matrix AND the
    # `complete` gate that exists to catch exactly that, producing a fully green
    # run that tested nothing. Naming the event removes the dependency on how a
    # missing `inputs` renders: for anything that is not a dispatch, the first
    # clause short-circuits true and the ports always run.
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.credential_only) }}
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.list.outputs.ports }}
      dialects: ${{ steps.list.outputs.dialects }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        # Both dimensions come from here so the matrix and the `complete` gate
        # below cannot drift. If they were listed separately, the gate would
        # verify the matrix against a copy of its own definition.
        run: |
          echo "ports=$(ls ports | grep -vE '^(TEMPLATE|README\.md)$' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo 'dialects=["postgres","mysql","mssql"]' >> "$GITHUB_OUTPUT"

  port:
    name: ${{ matrix.port }} on ${{ matrix.dialect }} vs cleat@${{ inputs.cleat_ref || 'develop' }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.discover.outputs.ports) }}
        dialect: ${{ fromJSON(needs.discover.outputs.dialects) }}
    # No `services:` block. The databases come up through `make deps`, which is
    # the path the harness is built around and the one a developer runs. SQL
    # Server in particular needs a step no service container performs: its image
    # creates no user database, so `deps` runs
    # `sqlcmd -Q "IF DB_ID('cleat_ports') IS NULL CREATE DATABASE cleat_ports"`.
    # Hand-rolling the containers reproduces a failure that is not real.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.25" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      # ONE LEG PER RUNNER, AND THAT IS LOAD-BEARING. Each matrix combination
      # is its own job on a fresh VM, so no leg inherits another's containers,
      # .port-results/ or stray worker process.
      #
      # It matters because `make port`'s cleanup is dialect-blind: in
      #
      #   @trap './scripts/worker.sh stop' EXIT ...; CLEAT_PORTS_DIALECT=$(DIALECT) ./scripts/run-port.sh
      #
      # the assignment is a command prefix on run-port.sh, so the trap's shell
      # never sees it and cleanup runs at the DEFAULT dialect. That is not
      # cosmetic: scripts/worker.sh's stop_worker calls `owned || refuse_foreign`
      # (:224), and owned() matches the running process's command line against
      # $CLEAT_PORTS_DSN (:188) -- which, computed at the wrong dialect, will not
      # match a mysql or mssql worker. Cleanup then declares its own worker
      # foreign and exits, leaving it alive.
      #
      # So a sequential sweep that switched dialects inside ONE shell would
      # leave a worker behind at every non-postgres leg, and the next leg at a
      # different dialect would be refused -- with a message naming two wrong
      # causes before the real one. Nobody has hit it because a single manual
      # run never switches dialects.
      #
      # cleat-ports#94 fixes that trap at `port`, `all-ports` and
      # `worker-down`. It is still worth knowing here, because the sequential
      # local sweep is exactly what someone reproducing a red nightly by hand
      # will run.
      #
      # Do not consolidate these legs into a single job to save runner minutes.
      # Fresh-VM-per-combination is what keeps the trap dormant, and -- since
      # #94 -- it is also what keeps the legs out of contention with each
      # other. Contention on one runner is the condition that produced the one
      # red dbos/mssql run.
      - name: Start ${{ matrix.dialect }}
        run: make deps DIALECT=${{ matrix.dialect }}
      - name: Install cleat @ ${{ inputs.cleat_ref || 'develop' }}
        run: make install-cleat CLEAT_REF=${{ inputs.cleat_ref || 'develop' }}
      - name: Record cleat commit under test
        id: build
        # Per leg, not once for the run: ports CI builds cleat from a moving
        # CLEAT_PINNED_REF, so a nightly can go red because CLEAT changed with no
        # ports commit involved. Without the SHA in each leg's log that costs an
        # investigation (cleat-ports#87) for information the run already had.
        run: |
          cat bin/.cleat-build >> "$GITHUB_OUTPUT"
          echo "--- ${{ matrix.port }} on ${{ matrix.dialect }}: $(tr '\n' ' ' < bin/.cleat-build)"
      # TIMING-SENSITIVE LEG, stated here rather than discovered later.
      # dbos-transact-py on mssql went red once under load with four failures,
      # then fully green on re-run at UNDER HALF the wall time (34m19s ->
      # 15m05s). Three of the four were TimeoutError on the HTTP socket -- the
      # client giving up on the API, not an assertion -- alongside
      # `context deadline exceeded`, `WATCHDOG: loop did not exit within 5s of
      # cancellation`, and `Invalid TDS stream: did not get cancellation
      # confirmation`. That is contention, and it will recur on a loaded runner.
      #
      # RE-RUN THAT LEG ONCE BEFORE BELIEVING A RED. Not silencing it: a leg
      # that reddens under contention is saying something true about the
      # engine, and confirming costs 15 minutes. An `exclude:` naming those
      # four tests was drafted and withdrawn -- it would have encoded a
      # machine's bad half-hour as a permanent property of SQL Server, which is
      # a known-failures list by another name: an expectation nobody rechecks.
      - name: Run port
        env:
          # Turns on `coverage run` + a JUnit report for the Python port, which
          # the assertion-execution step below needs. Set only for that port:
          # the Go ports have no equivalent and would pay for nothing.
          CLEAT_PORTS_COVERAGE: ${{ matrix.port == 'dbos-transact-py' && '1' || '0' }}
        run: make port PORT=${{ matrix.port }} DIALECT=${{ matrix.dialect }}
      - name: Prove this leg used ${{ matrix.dialect }}
        # The matrix key is a string we wrote; asserting on it proves only that
        # someone can type. This asks the database two independent questions --
        # what it says it is, and whether the run's rows are in it and NOT in
        # postgres, which is up for every dialect and is where a silent fallback
        # would land.
        run: scripts/assert-dialect.sh ${{ matrix.dialect }}
      - name: Record that this leg reported
        if: always()
        run: |
          # NOT a dotted directory. actions/upload-artifact@v4 excludes hidden
          # files by default, so `.leg/` uploaded nothing while the step still
          # reported success -- if-no-files-found defaults to `warn`.
          mkdir -p leg-markers
          # The OUTCOME goes in the marker, not just the leg's name. Without it
          # the only record of which leg failed is the run's job list, which is
          # readable by a human on the page and by nothing else -- so the
          # `report` job below, which has to say what failed, would have had to
          # ask the API for it, with a token, which is the single point of
          # failure this change exists to remove.
          echo "${{ matrix.port }} ${{ matrix.dialect }} ${{ job.status }} $(tr '\n' ' ' < bin/.cleat-build 2>/dev/null)" \
            > "leg-markers/${{ matrix.port }}--${{ matrix.dialect }}"
      - name: Upload leg marker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leg-${{ matrix.port }}--${{ matrix.dialect }}
          path: leg-markers/
          if-no-files-found: error
      - name: The worker logged no unexplained errors
        # Same step as ci.yml's. It is here because the omission was the point:
        # ports#163 added this to ci.yml only, and the nightly -- the run whose
        # uploaded logs carried the 74 SQL errors that prompted cleat#1133 in
        # the first place -- did not get it. Landing a fix in one workflow and
        # not its sibling is exactly what ports#162 was, one file over.
        #
        # The nightly is per-DIALECT where ci.yml is per-port, so this leg sees
        # one dialect's log in isolation. That is the stronger placement: it is
        # where a dialect-specific background failure shows up unmixed.
        if: always()
        run: python3 scripts/check-worker-log.py

      - name: Every assertion in a passing test actually ran
        # The third member of the family the two checks above belong to.
        # ports#172 was an assertion that ran and could not distinguish the
        # behaviours it named; ports#173 was a harness action that silently did
        # nothing, turning five recovery tests into no-crash controls that
        # passed. This one is an assertion that never RAN -- a guard not
        # entered, an early return -- in a test that reported green.
        #
        # Here rather than in ci.yml deliberately: it needs the suite run under
        # coverage, which the per-PR run has no reason to pay for. The sibling
        # omission that ports#164 was about is the opposite mistake, and the
        # reasoning is recorded so this placement is read as a choice.
        #
        # dbos-transact-py only: coverage of test files is a Python capability.
        # Go excludes _test.go from its coverage by design, so the Go ports have
        # no equivalent and are NOT covered by this. Said plainly because a
        # green check here must not be read as a statement about all 201 cases.
        if: always() && matrix.port == 'dbos-transact-py'
        run: |
          python3 scripts/selftest-check-assertions.py
          python3 scripts/check-assertions-executed.py \
            ports/dbos-transact-py ports/dbos-transact-py/junit.xml

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.port }}--${{ matrix.dialect }}
          path: .port-results/
          # .port-results is a DOTTED directory and upload-artifact@v4 skips
          # hidden files unless told otherwise, so this step has been uploading
          # nothing while reporting success. Pre-existing; the nightly has had no
          # logs attached for as long as it has been on v4.
          include-hidden-files: true
          if-no-files-found: ignore

  complete:
    name: Every port ran on every dialect
    needs: [discover, port]
    if: always() && (github.event_name != 'workflow_dispatch' || !inputs.credential_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { pattern: "leg-*", path: legs, merge-multiple: true }
      - name: Every expected leg reported
        # `needs:` is NOT the gate. A job that depends on a matrix succeeds when
        # the matrix is EMPTY, so an aggregate gating only on `needs: port`
        # passes when zero legs were generated -- a green run that tested
        # nothing, which is the cleat#1068 shape.
        #
        # So this recomputes ports x dialects from the same `discover` outputs
        # the matrix used and requires every element BY NAME. Comparing sets,
        # not counts: a count is satisfied by the wrong legs reporting.
        env:
          PORTS: ${{ needs.discover.outputs.ports }}
          DIALECTS: ${{ needs.discover.outputs.dialects }}
        run: scripts/assert-legs-complete.sh legs

  report:
    name: Report to core
    needs: [discover, port]
    if: always() && (github.event_name != 'workflow_dispatch' || !inputs.credential_only) && needs.port.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { pattern: "leg-*", path: legs, merge-multiple: true }

      # TOKEN-FREE, AND FIRST, AND THE ORDER IS THE WHOLE POINT.
      #
      # Until 2026-09-09 this job had one step, and it needed a cross-repo PAT.
      # That night the PAT came back `401 Bad credentials` (run 34340316935), so
      # a real failure -- dbos-transact-py on mysql -- was found and reported to
      # nobody. The route from "the nightly found something" to "a human knows"
      # ran entirely through one credential.
      #
      # Worse than the expiry: `report` runs only when the matrix FAILED, so the
      # token is exercised only on the nights it matters. A green night never
      # touches it. Its breakage is therefore perfectly correlated with the
      # event it exists to report, and nothing can discover it early, because
      # the only thing that would is the thing it breaks.
      #
      # So the breakdown is rendered here, from this run's own artifacts, with
      # no network and no credential, BEFORE anything that can fail on auth.
      # `did last night's nightly find something` is now answerable by opening
      # the run.
      - name: Which legs failed
        run: scripts/render-nightly-summary.sh legs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open or update the tracking issue on cleat-team/cleat
        env:
          # A PAT (or GitHub App token) with `issues: write` on cleat-team/cleat.
          # The default GITHUB_TOKEN is scoped to THIS repo and cannot open an
          # issue on another one.
          GH_TOKEN: ${{ secrets.CLEAT_CORE_ISSUE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # STILL FATAL ON FAILURE. A reporting step that exits 0 when it could not
        # report turns "the nightly found something" into a green run, which is
        # strictly worse than a red one -- there is nothing left to notice. What
        # changed is the LABEL: the script emits a titled annotation naming a
        # rejected or missing credential as a HARNESS failure, so the run list
        # no longer renders "rotate a secret" and "a port diverged" identically.
        run: scripts/file-core-issue.sh
