# ---------------------------------------------------------------------------
# Branch Naming Check — validates PR source branches follow gitflow convention
#
# Prefixes match cleat-team/cleat's list, not cleat-bench's. The two already
# disagree -- bench rejects `docs/`, core accepts it -- so a contributor moving
# between repos hits an arbitrary difference. Following the core repo is the
# choice that surprises the fewest people. See cleat-team/cleat-bench#9.
# ---------------------------------------------------------------------------
name: Branch Naming Check

on:
  pull_request:
    # `edited` for the same reason ci.yml has it: a retargeted PR should be
    # re-checked against the branch rules for its NEW base, and a base change
    # fires no other trigger.
    types: [opened, synchronize, reopened, edited]
  # Required checks must report in the merge queue too, or the queue deadlocks
  # waiting for a status nothing will produce.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      # In the queue this check is both impossible and pointless.
      #
      # Impossible: a merge_group event carries no pull_request payload, so
      # `context.payload.pull_request.head.ref` below is undefined and the
      # script throws.
      #
      # Pointless: the branch under test is GitHub's own
      # `gh-readonly-queue/develop/pr-N-<sha>`, which matches none of the
      # allowed prefixes and never could. The contributor's branch name was
      # already validated on the pull request, and a name cannot change between
      # there and here.
      #
      # Reporting success rather than skipping the job is deliberate: a skipped
      # JOB still satisfies a required check, but a job that fails to start
      # does not, and the difference is invisible until the queue stalls.
      - name: Branch name was validated on the pull request
        if: github.event_name == 'merge_group'
        run: |
          echo "merge_group: the source branch was checked when the PR was opened."
          echo "The ref under test here is GitHub's own queue branch, ${{ github.ref }}."
      - name: Check branch naming convention
        if: github.event_name != 'merge_group'
        uses: actions/github-script@v8
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const author = context.payload.pull_request.user.login;
            const labels = context.payload.pull_request.labels.map(l => l.name);

            if (author === 'dependabot[bot]' || labels.includes('bot')) {
              console.log(`Exempt: ${author} (bot PR)`);
              return;
            }

            const validPrefixes = ['feature/', 'bugfix/', 'fix/', 'docs/', 'release/', 'hotfix/'];

            if (!validPrefixes.some(p => branch.startsWith(p))) {
              // `return` after setFailed, deliberately. cleat-bench's copy omits
              // it and falls through to the success log, so the last line of a
              // failed run reads "follows convention". See cleat-team/cleat-bench#9.
              core.setFailed(
                `BRANCH NAME: ${branch}\n\n` +
                `Branch names must follow the gitflow convention with one of these prefixes:\n\n` +
                `  feature/   — new functionality        (e.g. feature/dbos-queue-tests)\n` +
                `  bugfix/    — bug fixes                 (e.g. bugfix/worker-restart)\n` +
                `  fix/       — CI, config, tooling fixes (e.g. fix/postgres-port)\n` +
                `  docs/      — documentation only        (e.g. docs/adding-a-port)\n` +
                `  release/   — release preparation       (e.g. release/v1.2.0)\n` +
                `  hotfix/    — critical production fix   (e.g. hotfix/harness-hang)\n\n` +
                `Use lowercase, hyphens (not underscores), and keep names concise.`
              );
              return;
            }

            console.log(`Branch name "${branch}" follows convention.`);
